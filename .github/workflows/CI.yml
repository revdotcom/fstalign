name: CI

# Trigger the workflow on a push event or manually from the Actions tab
on: [push, workflow_dispatch]

jobs:
  # This workflow has one job
  # First we build the docker container, then we run CI tests
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AI-611: plus trixie, noble and resolute, the bases of Rev's speech images (Dockerfile).
        debian_base: [bullseye, bookworm, trixie, noble, resolute]
    env: 
      DOCKER_IMAGE: fstalign
      DEBIAN_BASE: ${{ matrix.debian_base }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Build the docker container
        run: |
          docker build . -f Dockerfile \
            --build-arg DEBIAN_BASE=${DEBIAN_BASE} \
            -t ${DOCKER_IMAGE}:${DEBIAN_BASE}

      - name: Run CI tests
        run: docker run --rm -t ${DOCKER_IMAGE}:${DEBIAN_BASE} bash -c '(cd build && make test)'

      # Consumers copy /fstalign/bin/fstalign into an image of the same base: its shared libraries (ICU) must
      # all resolve there.
      - name: Check the binary's libraries
        run: docker run --rm ${DOCKER_IMAGE}:${DEBIAN_BASE} bash -c '. /etc/os-release && echo "$PRETTY_NAME" && ldd /fstalign/bin/fstalign && ! ldd /fstalign/bin/fstalign | grep -q "not found"'
