name: CI

# Trigger the workflow on a push event or manually from the Actions tab
on: [push, workflow_dispatch]

jobs:
  # This workflow has one job
  # First we build the docker container, then we run CI tests
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_os: [resolute, wolfi]
    env: 
      DOCKER_IMAGE: fstalign
      BASE_OS: ${{ matrix.base_os }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Build the docker container
        run: |
          docker build . -f Dockerfile \
            --build-arg BASE_OS=${BASE_OS} \
            -t ${DOCKER_IMAGE}:${BASE_OS}

      - name: Run CI tests
        run: docker run --rm -t ${DOCKER_IMAGE}:${BASE_OS} bash -c '(cd build && make test)'

      # Consumers copy /fstalign/bin/fstalign into an image of the same base: its shared libraries (ICU) must
      # all resolve there.
      - name: Check the binary's libraries
        run: docker run --rm ${DOCKER_IMAGE}:${BASE_OS} bash -c '. /etc/os-release && echo "$PRETTY_NAME" && ldd /fstalign/bin/fstalign && ! ldd /fstalign/bin/fstalign | grep -q "not found"'
