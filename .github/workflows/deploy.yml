name: Publish Docker image
on:
  release:
    types: [published]
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian_base: [bullseye, bookworm]
    env:
      DEBIAN_BASE: ${{ matrix.debian_base }}
    steps:
      - 
        name: Check out the repo
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - 
        name: Prepare tags
        id: prep
        run: |
          DOCKER_IMAGE=revdotcom/fstalign
          VERSION=develop
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          {
            echo "${DOCKER_IMAGE}:${VERSION}-${DEBIAN_BASE}"
            if [ "${DEBIAN_BASE}" = "bullseye" ]; then
              echo "${DOCKER_IMAGE}:${VERSION}"
              echo "${DOCKER_IMAGE}:latest"
            fi
          } > tags.txt
          delimiter="$(openssl rand -hex 8)"
          echo "tags<<${delimiter}" >> $GITHUB_OUTPUT
          cat tags.txt >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
          echo ::set-output name=version::${VERSION}
          echo ::set-output name=created::$(date -u +'%Y-%m-%dT%H:%M:%SZ')

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      -
        name: Login to DockerHub
        uses: docker/login-action@v1 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - 
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            DEBIAN_BASE=${{ env.DEBIAN_BASE }}
          tags: ${{ steps.prep.outputs.tags }}
